<!DOCTYPE html>
<html lang="en" layout:decorate="~{layouts/layout}">
  <th:block layout:fragment="css">
    <link rel="stylesheet" th:href="@{/assets/css/upload.css}">
</th:block>
  <div class="container px-6 mx-auto grid" layout:fragment="content">
    <h2
      class="my-6 text-2xl font-semibold text-gray-700 dark:text-gray-200"
      id="pageTitle"
      th:data-title="${dto.title}"
    >
      Movie Modify
    </h2>

    <div class="w-full overflow-x-auto">
      <div
        class="px-4 py-3 mb-8 bg-white rounded-lg shadow-md dark:bg-gray-800"
      >
        <form th:action="@{/movie/modify}" method="post" id="modifyForm">
          <input type="hidden" name="mno" th:value="${dto.mno}" />
          <input type="hidden" name="page" th:value="${requestDTO.page}" />
          <input type="hidden" name="size" th:value="${requestDTO.size}" />
          <input type="hidden" name="type" th:value="${requestDTO.type}" />
          <input type="hidden" name="keyword" th:value="${requestDTO.keyword}" />

          <div class="mt-4">
            <label class="block text-sm">
              <span class="text-gray-700 dark:text-gray-400">제목</span>
              <input
                class="block w-full mt-1 text-sm dark:border-gray-600 dark:bg-gray-700 focus:border-purple-400 focus:outline-none focus:shadow-outline-purple dark:text-gray-300 dark:focus:shadow-outline-gray form-input"
                placeholder="제목"
                name="title"
                th:value="${dto.title}"
              />
            </label>
          </div>
          <div class="mt-4">
            <label class="block text-sm">
              <span class="text-gray-700 dark:text-gray-400">리뷰 수</span>
              <input
                class="block w-full mt-1 text-sm dark:border-gray-600 dark:bg-gray-700 focus:border-purple-400 focus:outline-none focus:shadow-outline-purple dark:text-gray-300 dark:focus:shadow-outline-gray form-input"
                placeholder="리뷰수"
                name="reviewCnt"
                th:value="${dto.reviewCnt}"
                readonly
              />
            </label>
          </div>
          <div class="mt-4">
            <label class="block text-sm">
              <span class="text-gray-700 dark:text-gray-400">평점</span>
              <input
                class="block w-full mt-1 text-sm dark:border-gray-600 dark:bg-gray-700 focus:border-purple-400 focus:outline-none focus:shadow-outline-purple dark:text-gray-300 dark:focus:shadow-outline-gray form-input"
                placeholder="avg"
                name="avg"
                th:value="${#numbers.formatDecimal(dto.avg, 1, 1)}"
                readonly
              />
            </label>
          </div>
          <div class="mt-4">
            <label class="block text-sm">
              <span class="text-gray-700 dark:text-gray-400">포스터 추가</span>
              <input
                id="commonFileInput"
                class="block w-full mt-1 text-sm ... form-input"
                type="file"
                multiple
                accept="image/png, image/jpeg"
              />
            </label>
          </div>
          <div class="mt-4">
            <button
              type="submit"
              class="btn-modify px-4 py-2 text-sm font-medium leading-5 text-white transition-colors duration-150 bg-purple-600 border border-transparent rounded-lg active:bg-purple-600 hover:bg-purple-700 focus:outline-none focus:shadow-outline-purple"
            >
              수정
            </button>
            <button
              type="button"
              class="btn-remove px-4 py-2 text-sm font-medium leading-5 text-white transition-colors duration-150 bg-red-600 border border-transparent rounded-lg active:bg-red-600 hover:bg-red-700 focus:outline-none focus:shadow-outline-red"
            >
              삭제
            </button>
              <a th:href="@{/movie/list(page=${requestDTO.page}, 
                                size=${requestDTO.size},
                                type=${requestDTO.type},
                                keyword=${requestDTO.keyword})}"
                    class="px-4 py-2 text-sm font-medium leading-5 text-white transition-colors duration-150 bg-blue-600 border border-transparent rounded-lg active:bg-blue-600 hover:bg-blue-700 focus:outline-none focus:shadow-outline-blue">목록</a>
          </div>
        </form>
      </div>

      <div id="commonUploadResult" class="uploadResult mt-4 mb-4">
        <ul class="flex flex-wrap gap-4">
          <li
            th:each="movieImage : ${dto.mImages}"
            th:data-name="${movieImage.imgName}"
            th:data-path="${movieImage.path}"
            th:data-uuid="${movieImage.uuid}"
            class="flex flex-col w-32 bg-white dark:bg-gray-700 rounded-lg shadow-md overflow-hidden border border-gray-200 dark:border-gray-600"
          >
            <div class="h-44 w-full overflow-hidden bg-gray-100">
              <img
                class="w-full h-full object-cover"
                th:src="|/upload/display?fileName=${movieImage.getThumbnailURL()}|"
              />
            </div>

            <div class="flex items-center justify-between p-2 gap-1">
              <span
                class="text-xs font-medium text-gray-600 dark:text-gray-300 truncate"
                th:text="${movieImage.imgName}"
                th:title="${movieImage.imgName}"
              >
                파일명
              </span>
              <button
                type="button"
                th:data-file="${movieImage.getImageURL()}"
                class="common-remove-btn text-red-500 hover:text-red-700 p-1"
              >
                <svg
                  class="w-4 h-4"
                  fill="none"
                  stroke="currentColor"
                  viewBox="0 0 24 24"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M6 18L18 6M6 6l12 12"
                  ></path>
                </svg>
              </button>
            </div>
          </li>
        </ul>
      </div>

      <div>
        <div class="flex items-center">
          <span
            >리뷰작성 [
            <span class="review-cnt" th:text="${dto.reviewCnt}"></span> ]</span
          >
        </div>
      </div>

      <div
        class="px-4 py-3 mb-8 bg-white rounded-lg shadow-md dark:bg-gray-800"
      >
        <div class="mt-4">
          <label class="block text-sm">
            <span class="text-gray-700 dark:text-gray-400">작성자</span>
            <input
              name="nickname"
              class="block w-full mt-1 text-sm dark:border-gray-600 dark:bg-gray-700 focus:border-purple-400 focus:outline-none focus:shadow-outline-purple dark:text-gray-300 dark:focus:shadow-outline-gray form-input"
            />
          </label>
        </div>
        <label class="block mt-4 text-sm">
          <span class="text-gray-700 dark:text-gray-400">감상평</span>
          <textarea
            name="text"
            class="block w-full mt-1 text-sm dark:text-gray-300 dark:border-gray-600 dark:bg-gray-700 form-textarea focus:border-purple-400 focus:outline-none focus:shadow-outline-purple dark:focus:shadow-outline-gray"
            rows="3"
            placeholder="감상평을 등록해 주세요"
          ></textarea>
        </label>
      </div>
    </div>

    <form th:action="@{/movie/remove}" method="post" id="removeForm">
      <input type="hidden" name="mno" th:value="${dto.mno}" />
      <input type="hidden" name="page" th:value="${requestDTO.page}" />
      <input type="hidden" name="size" th:value="${requestDTO.size}" />
      <input type="hidden" name="type" th:value="${requestDTO.type}" />
      <input type="hidden" name="keyword" th:value="${requestDTO.keyword}" />
    </form>
  </div>

  <th:block layout:fragment="script">
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"
    ></script>
    <script th:src="@{/assets/js/upload.js}"></script>
    <script th:src="@{/assets/js/modify.js}"></script>
  </th:block>
</html>
