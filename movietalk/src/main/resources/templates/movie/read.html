<!DOCTYPE html>
<html lang="en" layout:decorate="~{layouts/layout}">
  <th:block layout:fragment="css">
    <link rel="stylesheet" th:href="@{/assets/css/upload.css}">
<link rel="stylesheet" th:href="@{/assets/css/starrr.css}">    
</th:block>
  <div class="container px-6 mx-auto grid" layout:fragment="content">
    <h2
      id="movieTitle"
      th:data-title="${dto.title}"
      class="my-6 text-2xl font-semibold text-gray-700 dark:text-gray-200"
    >
      Movie Read
    </h2>
    <!-- New Table -->

    <div class="w-full overflow-x-auto">
      <div
        class="px-4 py-3 mb-8 bg-white rounded-lg shadow-md dark:bg-gray-800"
      >
        <form action="" method="post">
          <div class="mt-4">
            <label class="block text-sm">
              <span class="text-gray-700 dark:text-gray-400">제목</span>
              <input
                class="block w-full mt-1 text-sm dark:border-gray-600 dark:bg-gray-700 focus:border-purple-400 focus:outline-none focus:shadow-outline-purple dark:text-gray-300 dark:focus:shadow-outline-gray form-input"
                placeholder="제목"
                name="title"
                th:value="${dto.title}"
                readonly
              />
            </label>
          </div>
          <div class="mt-4">
            <label class="block text-sm">
              <span class="text-gray-700 dark:text-gray-400">리뷰 수</span>
              <input
                class="block w-full mt-1 text-sm dark:border-gray-600 dark:bg-gray-700 focus:border-purple-400 focus:outline-none focus:shadow-outline-purple dark:text-gray-300 dark:focus:shadow-outline-gray form-input"
                placeholder="리뷰수"
                name="reviewCnt"
                th:value="${dto.reviewCnt}"
                readonly
              />
            </label>
          </div>
          <div class="mt-4">
            <label class="block text-sm">
              <span class="text-gray-700 dark:text-gray-400">평점</span>
              <input
                class="block w-full mt-1 text-sm dark:border-gray-600 dark:bg-gray-700 focus:border-purple-400 focus:outline-none focus:shadow-outline-purple dark:text-gray-300 dark:focus:shadow-outline-gray form-input"
                placeholder="avg"
                name="avg"
                th:value="${dto.avg}"
                readonly
              />
            </label>
          </div>
          <div class="mt-4">
            <a
              th:href="@{/movie/modify(mno=${dto.mno}, 
                page=${requestDTO.page}, 
                size=${requestDTO.size},
                type=${requestDTO.type},
                keyword=${requestDTO.keyword})}"
              class="px-4 py-2 text-sm font-medium leading-5 text-white transition-colors duration-150 bg-purple-600 border border-transparent rounded-lg active:bg-purple-600 hover:bg-purple-700 focus:outline-none focus:shadow-outline-purple"
              >수정</a
            >

            <a
              th:href="@{/movie/list(page=${requestDTO.page}, 
                size=${requestDTO.size},
                type=${requestDTO.type},
                keyword=${requestDTO.keyword})}"
              class="px-4 py-2 text-sm font-medium leading-5 text-white transition-colors duration-150 bg-blue-600 border border-transparent rounded-lg active:bg-blue-600 hover:bg-blue-700 focus:outline-none focus:shadow-outline-blue"
              >목록</a
            >
          </div>
        </form>
      </div>
      <!-- 포스터 보여주기 -->
      <div class="uploadResult mb-4">
        <ul class="flex flex-wrap gap-4">
          <li
            th:each="movieImage : ${dto.mImages}"
            class="cursor-pointer"
            th:data-file="${movieImage.getThumbnailURL()}"
            th:data-full="${movieImage.getImageURL()}"
          >
            <img
              class="block w-32 rounded shadow-md hover:opacity-75"
              th:src="|/upload/display?fileName=${movieImage.getThumbnailURL()}|"
              data-bs-toggle="modal"
              data-bs-target="#imgModal"
            />
          </li>
        </ul>
      </div>

      <!-- 리뷰영역 -->
      <div>
        <div class="flex items-center">
          <span>리뷰작성 [ <span class="review-cnt"></span> ]</span>
        </div>
      </div>

      <!-- 리뷰작성 -->
      <div
        class="px-4 py-3 mb-8 bg-white rounded-lg shadow-md dark:bg-gray-800"
      >
        <form action="" method="post" id="reviewForm">
          <input
            type="hidden"
            id="loginUserId"
            th:value="${#authentication.name != 'anonymousUser' ? #authentication.name : ''}"
          />
          <input
            type="hidden"
            id="loginUserRole"
            th:value="${#authentication.name != 'anonymousUser' ? #authentication.authorities[0].authority : ''}"
          />

          <input type="hidden" name="rno" />
          <input type="hidden" name="mid" />
          <input type="hidden" name="mno" th:value="${dto.mno}" />
          <input type="hidden" name="grade" />

          <div class="mt-4">
            <label class="block text-sm">
              <span class="text-gray-700 dark:text-gray-400">작성자</span>
              <input
                readonly
                name="nickname"
                class="block w-full mt-1 text-sm dark:border-gray-600 dark:bg-gray-700 focus:border-purple-400 focus:outline-none focus:shadow-outline-purple dark:text-gray-300 dark:focus:shadow-outline-gray form-input"
                th:value="${#authentication.name != 'anonymousUser' ? #authentication.principal.nickname : '손님'}"
              />
            </label>
          </div>

          <label class="block mt-4 text-sm">
            <span class="text-gray-700 dark:text-gray-400">감상평</span>
            <textarea
              name="text"
              class="block w-full mt-1 text-sm dark:text-gray-300 dark:border-gray-600 dark:bg-gray-700 form-textarea focus:border-purple-400 focus:outline-none focus:shadow-outline-purple dark:focus:shadow-outline-gray"
              rows="3"
              placeholder="영화에 대한 감상평을 자유롭게 남겨주세요."
            ></textarea>
          </label>

          <div class="mt-4">
            <label class="block text-sm">
              <span class="text-gray-700 dark:text-gray-400">평점 선택</span>
              <div class="starrr mt-2"></div>
            </label>
          </div>

          <button
            type="button"
            class="reviewBtn block w-full px-4 py-2 mt-4 text-sm font-medium leading-5 text-center text-white transition-colors duration-150 bg-purple-600 border border-transparent rounded-lg active:bg-purple-600 hover:bg-purple-700 focus:outline-none focus:shadow-outline-purple"
          >
            리뷰 등록
          </button>
        </form>
      </div>

      <!-- 리뷰목록 -->
      <div
        class="mt-2 px-4 py-3 mb-8 bg-white rounded-lg shadow-md dark:bg-gray-800 reviewList"
      ></div>
    </div>
    <!-- Modal -->
    <div class="modal fade" id="imgModal" role="dialog" aria-modal="true">
      <div class="modal-dialog modal-lg">
        <div class="modal-content">
          <div class="modal-header">
            <h1 class="modal-title fs-5">영화명</h1>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body text-center">
            <img src="" alt="" style="max-width: 100%; height: auto" />
          </div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              Close
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
  <th:block layout:fragment="script">
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"
      integrity="sha512-v2CJ7UaYy4JwqLDIrZUI/4hqeoQieOmAZNXBeQyjo21dadnwR+8ZaIJVT8EE2iyI61OV8e6M8PP2/4hpQINQ/g=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    ></script>
    <script th:src="@{/assets/js/starrr.js}"></script>
    <script th:src="@{/assets/js/read.js}"></script>
  </th:block>
</html>
